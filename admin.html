<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Mandala Finance</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f4f6fb;color:#16224a}
header{background:#f8d200;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:18px}
main{max-width:1100px;margin:20px auto;padding:0 16px}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(20,52,107,.1)}
#loginBox{max-width:360px;margin:60px auto}
label{display:block;font-size:14px;margin:12px 0 4px}
input,select,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid #c5cce0}
input{width:100%}
button{cursor:pointer;background:#14346b;color:#fff;border:0}
button.ghost{background:#fff;color:#14346b;border:1px solid #14346b}
button.danger{background:#c62828}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.bar input{flex:1;min-width:180px;width:auto}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #e3e7f2;vertical-align:top}
th{font-size:12px;text-transform:uppercase;color:#5a6791}
.msg{margin-top:10px;font-size:14px;color:#c62828}
a{color:#14346b;font-weight:600}
</style>
</head>
<body>
<header>
  <h1>Admin Mandala Finance</h1>
  <button id="logout" class="ghost" hidden>Keluar</button>
</header>
<main>
  <section id="loginBox" class="card" hidden>
    <h2>Masuk Admin</h2>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <p><button type="submit">Masuk</button></p>
    </form>
    <div id="loginMsg" class="msg"></div>
  </section>

  <section id="app" class="card" hidden>
    <div class="bar">
      <input id="cari" placeholder="Cari nama, WhatsApp, atau kota...">
      <select id="filter"><option value="">Semua status</option></select>
      <button id="muat" class="ghost">Muat ulang</button>
    </div>
    <div id="info"></div>
    <div class="wrap">
      <table>
        <thead><tr><th>Waktu</th><th>Nama</th><th>WhatsApp</th><th>Kota</th><th>Produk</th><th>Nilai</th><th>Pesan</th><th>Status</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var SUPABASE_URL="https://zkqfmadldbeqkilfgnmq.supabase.co";
var SUPABASE_KEY="sb_publishable_K6Etra48Jan4o7anW6rYIA_R9Ph43jB";
var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var STATUS=["Baru","Dihubungi","Proses","Closing","Batal"];
var allRows=[];
function $(id){return document.getElementById(id)}

STATUS.forEach(function(s){var o=document.createElement("option");o.value=s;o.textContent=s;$("filter").appendChild(o);});

function tampil(masuk){
  $("loginBox").hidden=masuk;
  $("app").hidden=!masuk;
  $("logout").hidden=!masuk;
}
function waNomor(n){
  var d=String(n||"").replace(/\D/g,"");
  if(d.indexOf("0")===0)d="62"+d.slice(1);
  return d;
}

async function mulai(){
  var s=await sb.auth.getSession();
  if(!s.data.session){tampil(false);return;}
  var a=await sb.rpc("is_admin");
  if(a.data!==true){
    await sb.auth.signOut();
    tampil(false);
    $("loginMsg").textContent="Akun ini bukan admin.";
    return;
  }
  tampil(true);
  muat();
}

$("loginForm").addEventListener("submit",async function(e){
  e.preventDefault();
  $("loginMsg").textContent="Masuk...";
  var r=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("pw").value});
  $("pw").value="";
  if(r.error){$("loginMsg").textContent="Email atau password salah.";return;}
  $("loginMsg").textContent="";
  mulai();
});
$("logout").onclick=async function(){await sb.auth.signOut();tampil(false);};

async function muat(){
  $("info").textContent="Memuat...";
  var r=await sb.from("calon_nasabah").select("*").order("created_at",{ascending:false});
  if(r.error){$("info").textContent="Gagal memuat data: "+r.error.message;return;}
  allRows=r.data;
  gambar();
}

function gambar(){
  var q=$("cari").value.trim().toLowerCase(), f=$("filter").value;
  var rows=allRows.filter(function(r){
    if(f&&r.status!==f)return false;
    var t=[r.nama,r.whatsapp,r.kota].join(" ").toLowerCase();
    return !q||t.indexOf(q)>-1;
  });
  $("info").textContent=rows.length+" dari "+allRows.length+" calon nasabah";
  var tb=$("rows");tb.textContent="";
  rows.forEach(function(r){
    var tr=document.createElement("tr");
    function td(txt){var c=document.createElement("td");c.textContent=txt==null?"":txt;tr.appendChild(c);return c;}
    td(new Date(r.created_at).toLocaleString("id-ID",{timeZone:"Asia/Makassar",dateStyle:"medium",timeStyle:"short"}));
    td(r.nama);
    var cw=td("");
    var a=document.createElement("a");
    a.textContent=r.whatsapp;a.href="https://wa.me/"+waNomor(r.whatsapp);a.target="_blank";a.rel="noopener";
    cw.appendChild(a);
    td(r.kota);td(r.produk);td(r.nilai);td(r.pesan);
    var cs=td("");
    var sel=document.createElement("select");
    var opts=STATUS.indexOf(r.status)>-1?STATUS:STATUS.concat([r.status]);
    opts.forEach(function(s){var o=document.createElement("option");o.value=s;o.textContent=s;if(s===r.status)o.selected=true;sel.appendChild(o);});
    sel.onchange=function(){ubahStatus(r.id,sel.value,sel);};
    cs.appendChild(sel);
    var cd=td("");
    var b=document.createElement("button");
    b.className="danger";b.textContent="Hapus";b.onclick=function(){hapus(r);};
    cd.appendChild(b);
    tb.appendChild(tr);
  });
}

async function ubahStatus(id,val,sel){
  sel.disabled=true;
  var x=await sb.from("calon_nasabah").update({status:val}).eq("id",id).select();
  sel.disabled=false;
  if(x.error||!x.data.length){alert("Gagal mengubah status.");muat();return;}
  allRows.forEach(function(y){if(y.id===id)y.status=val;});
}

async function hapus(r){
  if(!confirm("Hapus data "+r.nama+"? Tindakan ini tidak bisa dibatalkan."))return;
  var x=await sb.from("calon_nasabah").delete().eq("id",r.id).select();
  if(x.error||!x.data.length){alert("Gagal menghapus data.");return;}
  allRows=allRows.filter(function(y){return y.id!==r.id;});
  gambar();
}

$("cari").oninput=gambar;
$("filter").onchange=gambar;
$("muat").onclick=muat;
mulai();
</script>
</body>
</html>
